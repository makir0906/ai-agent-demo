<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-app">
    <h1>ToDoリスト</h1>

    <form id="todo-form" class="todo-form">
      <label class="sr-only" for="todo-input">タスク</label>
      <input
        id="todo-input"
        type="text"
        placeholder="タスクを入力"
        maxlength="100"
        autocomplete="off"
        required
      >
      <button type="submit">追加</button>
    </form>

    <p id="empty-message" class="empty-message">タスクはありません。</p>

    <ul id="todo-list" class="todo-list" aria-label="タスク一覧"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
